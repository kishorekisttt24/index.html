<title>FFKFANREELS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial, sans-serif;
}


/* REELS CONTAINER */

.reels{
    width:100%;
    height:100vh;

    overflow-y:auto;

    scroll-snap-type:y mandatory;

    scrollbar-width:none;
}

.reels::-webkit-scrollbar{
    display:none;
}


/* EACH REEL */

.reel{
    width:100%;
    height:100vh;

    position:relative;

    scroll-snap-align:start;
    scroll-snap-stop:always;

    background:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}


/* YOUTUBE VIDEO */

.reel iframe{
    width:100%;
    height:100%;

    border:none;

    display:block;
}


/* TOP LOGO */

.logo{
    position:absolute;

    top:20px;
    left:20px;

    z-index:20;

    color:white;

    font-size:22px;
    font-weight:800;

    letter-spacing:1px;

    text-shadow:
        0 2px 8px #000;
}


/* HOME BUTTON */

.home{
    position:absolute;

    top:18px;
    right:18px;

    z-index:20;

    padding:9px 16px;

    border-radius:20px;

    background:#ff0000;

    color:white;

    text-decoration:none;

    font-size:13px;
    font-weight:bold;

    box-shadow:
        0 0 15px rgba(255,0,0,.45);
}


/* BOTTOM INFORMATION */

.info{
    position:absolute;

    left:20px;
    right:70px;
    bottom:35px;

    z-index:15;

    color:white;

    text-shadow:
        0 2px 10px #000;
}

.info h2{
    font-size:24px;

    margin-bottom:7px;
}

.info p{
    font-size:14px;

    color:#ddd;

    line-height:1.5;
}


/* SIDE BUTTONS */

.side-buttons{
    position:absolute;

    right:18px;
    bottom:90px;

    z-index:20;

    display:flex;

    flex-direction:column;

    gap:16px;
}

.side-btn{
    width:45px;
    height:45px;

    border-radius:50%;

    background:rgba(0,0,0,.55);

    border:1px solid rgba(255,255,255,.25);

    color:white;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:20px;

    text-decoration:none;
}


/* SCROLL INDICATOR */

.scroll{
    position:absolute;

    bottom:10px;
    left:50%;

    transform:translateX(-50%);

    z-index:20;

    color:white;

    font-size:11px;

    opacity:.7;

    letter-spacing:1px;
}


/* MOBILE */

@media(max-width:600px){

    .logo{
        font-size:19px;
        top:15px;
        left:15px;
    }

    .home{
        top:14px;
        right:14px;
        padding:8px 13px;
    }

    .info{
        left:15px;
        bottom:30px;
    }

    .info h2{
        font-size:21px;
    }

    .info p{
        font-size:13px;
    }

    .side-buttons{
        right:12px;
        bottom:85px;
    }

}

</style>
